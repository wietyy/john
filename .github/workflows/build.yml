name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: install deps
        working-directory: src
        run: npm ci

      - name: compile
        working-directory: src
        run: npm run build
