<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOHN</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">JOHN</h1>
            <nav class="nav">
                <span class="mono-white" id="nav-account" style="color:#9ca3af;font-size:0.875rem">Checking</span>
                <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
            </nav>
        </div>
    </header>

    <main class="app-main">
        <input id="account-name" type="text" class="account-name-input" value="Checking" placeholder="Account name">

        <div class="app-grid">
            <!-- Account Details -->
            <section class="panel">
                <h2>Account Details</h2>
                <div class="summary-row">
                    <span class="mono">NSM</span>
                    <span class="mono-blue" id="nsm">$0.00</span>
                </div>
                <div class="summary-row">
                    <span class="mono">Funds</span>
                    <span class="mono-green" id="funds-total">$0.00</span>
                </div>
                <div class="summary-row">
                    <span class="mono-white">Total</span>
                    <span class="mono-white" id="grand-total">$0.00</span>
                </div>
            </section>

            <!-- Coming soon -->
            <section class="panel panel-dashed">
                <p>More coming soon</p>
            </section>

            <!-- Transactions -->
            <section class="panel">
                <h2>Transactions</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Memo</th>
                                <th>Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="txn-body"></tbody>
                    </table>
                </div>
                <button id="add-txn" class="btn-dashed">+ New Transaction</button>
            </section>

            <!-- Funds -->
            <section class="panel">
                <h2>Funds</h2>
                <div class="fund-list" id="fund-list"></div>
                <button id="add-fund" class="btn-dashed">+ New Fund</button>
            </section>
        </div>
    </main>

    <div class="tabs-bar">
        <div class="tabs" id="tabs"></div>
        <button id="add-tab" class="tab-add" title="New account">+</button>
    </div>

    <script src="/app.js"></script>
</body>
</html>
