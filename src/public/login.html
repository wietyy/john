<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — JOHN</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1>Sign In</h1>
            <p class="login-error" id="error"></p>
            <div class="login-fields">
                <input type="text" placeholder="Username" id="username" class="input" autocomplete="off">
                <input type="password" placeholder="Password" id="password" class="input">
                <div class="login-btns">
                    <button id="login-btn" class="btn btn-blue">Login</button>
                    <button id="signup-btn" class="btn btn-outline">Sign Up</button>
                </div>
            </div>
            <a href="/" class="back-home">Back to home</a>
        </div>
    </div>
    <script src="/login.js"></script>
</body>
</html>
